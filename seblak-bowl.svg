<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Semangkuk seblak pedas yang berputar pelan</title>
  <style>
    /* Ubah 40s untuk mengatur kecepatan putar (makin besar makin lambat) */
    .spin  { transform-origin: 300px 300px; animation: spin 40s linear infinite; }
    .glow  { transform-origin: 300px 300px; animation: glow 5s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; opacity: 0; animation: twinkle 3.6s ease-in-out infinite; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes glow    { 0%, 100% { opacity: 0.75; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .spin, .glow, .spark { animation: none; }
      .spark { opacity: 0.8; }
    }
  </style>

  <defs>
    <radialGradient id="glow">
      <stop offset="0.7" stop-color="#FFC46B" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#FF8A3D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5A2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ceramic" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6D9D0"/>
    </radialGradient>
    <radialGradient id="broth" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#F0502A"/>
      <stop offset="0.7" stop-color="#D33A16"/>
      <stop offset="1" stop-color="#A82A0E"/>
    </radialGradient>
    <radialGradient id="shine" cx="32%" cy="28%" r="60%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FBEBD3"/>
      <stop offset="1" stop-color="#C9A97C"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <g id="cracker">
      <ellipse rx="52" ry="26" fill="#F8C97F" stroke="#E0903A" stroke-width="4"/>
      <ellipse rx="34" ry="14" fill="#FBE2B4"/>
    </g>
    <g id="bakso"><circle r="24" fill="url(#ball)" stroke="#B8966A" stroke-width="2"/></g>
    <g id="sosis">
      <circle r="18" fill="#F4A19A" stroke="#D96F66" stroke-width="3"/>
      <circle r="9" fill="#F9C5BF"/>
    </g>
    <g id="leaf">
      <ellipse rx="42" ry="20" fill="#7DB84A" stroke="#4F8A2B" stroke-width="3"/>
      <path d="M-36 0H34M-10 0l-12-10M-10 0l-12 10M12 0l-10-9M12 0l-10 9" fill="none" stroke="#4F8A2B" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="chili">
      <circle r="8" fill="#FF3B1F" stroke="#B5200B" stroke-width="2"/>
      <circle r="2.5" fill="#FFE08A"/>
    </g>
    <circle id="ring" r="6" fill="none" stroke="#6DB33F" stroke-width="3"/>
    <path id="star" d="M0-16L4-4L16 0L4 4L0 16L-4 4L-16 0L-4-4Z" fill="#FFF3C4"/>
  </defs>

  <!-- Cahaya hangat yang berdenyut di belakang mangkuk -->
  <circle class="glow" cx="300" cy="300" r="295" fill="url(#glow)"/>

  <!-- Bayangan mangkuk -->
  <circle cx="300" cy="322" r="236" fill="#000" opacity="0.28" filter="url(#soft)"/>

  <!-- Mangkuk beserta isinya berputar pelan -->
  <g class="spin">
    <circle cx="300" cy="300" r="236" fill="url(#ceramic)" stroke="#CDBDB2" stroke-width="3"/>
    <circle cx="300" cy="300" r="222" fill="none" stroke="#C4290F" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 17.78" opacity="0.85"/>
    <circle cx="300" cy="300" r="204" fill="#D8CAC0"/>
    <circle cx="300" cy="300" r="198" fill="url(#broth)"/>

    <!-- Mie -->
    <path d="M196 336c30-40 55 20 85-15s55-30 85 5 45 10 60-20" fill="none" stroke="#F3D568" stroke-width="9" stroke-linecap="round"/>
    <path d="M214 262c28 30 52-18 82 6s50 28 80-4" fill="none" stroke="#F3D568" stroke-width="9" stroke-linecap="round"/>

    <!-- Kerupuk -->
    <use href="#cracker" transform="translate(222 215) rotate(-35)"/>
    <use href="#cracker" transform="translate(385 225) rotate(30)"/>
    <use href="#cracker" transform="translate(418 330) rotate(-75)"/>
    <use href="#cracker" transform="translate(330 415) rotate(12)"/>
    <use href="#cracker" transform="translate(215 370) rotate(-50)"/>

    <!-- Sawi -->
    <use href="#leaf" transform="translate(300 180) rotate(-80)"/>
    <use href="#leaf" transform="translate(430 292) rotate(70)"/>
    <use href="#leaf" transform="translate(178 282) rotate(100)"/>
    <use href="#leaf" transform="translate(296 430) rotate(95)"/>

    <!-- Telur -->
    <ellipse cx="300" cy="300" rx="38" ry="30" fill="#FFF8EC" stroke="#E8D9BE" stroke-width="3"/>
    <circle cx="300" cy="300" r="15" fill="#F7B733"/>
    <circle cx="295" cy="295" r="5" fill="#FFE08A" opacity="0.8"/>

    <!-- Bakso dan sosis -->
    <use href="#bakso" transform="translate(370 292)"/>
    <use href="#bakso" transform="translate(231 304) scale(0.9)"/>
    <use href="#bakso" transform="translate(302 372) scale(0.95)"/>
    <use href="#sosis" transform="translate(300 232)"/>
    <use href="#sosis" transform="translate(356 352)"/>
    <use href="#sosis" transform="translate(250 352)"/>

    <!-- Cabai utuh -->
    <g transform="translate(262 258) rotate(40)">
      <ellipse rx="26" ry="7" fill="#FF3B1F" stroke="#B5200B" stroke-width="2"/>
      <path d="M-26 0l-8-3" stroke="#3E7A2A" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(348 246) rotate(-30)">
      <ellipse rx="24" ry="7" fill="#FF3B1F" stroke="#B5200B" stroke-width="2"/>
      <path d="M24 0l8-3" stroke="#3E7A2A" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Irisan cabai rawit -->
    <use href="#chili" transform="translate(268 196)"/>
    <use href="#chili" transform="translate(336 200)"/>
    <use href="#chili" transform="translate(398 276)"/>
    <use href="#chili" transform="translate(204 262)"/>
    <use href="#chili" transform="translate(206 306)"/>
    <use href="#chili" transform="translate(346 398)"/>
    <use href="#chili" transform="translate(276 334)"/>
    <use href="#chili" transform="translate(330 330)"/>

    <!-- Irisan daun bawang -->
    <use href="#ring" transform="translate(250 205)"/>
    <use href="#ring" transform="translate(354 196)"/>
    <use href="#ring" transform="translate(412 360)"/>
    <use href="#ring" transform="translate(236 404)"/>
    <use href="#ring" transform="translate(190 340)"/>
    <use href="#ring" transform="translate(386 400)"/>
  </g>

  <!-- Kilau cahaya di permukaan kuah (diam, tidak ikut berputar) -->
  <circle cx="300" cy="300" r="198" fill="url(#shine)"/>

  <!-- Kilau bintang yang berkedip pelan -->
  <g transform="translate(78 110)"><use class="spark" href="#star" style="animation-delay:0s"/></g>
  <g transform="translate(528 98)"><use class="spark" href="#star" style="animation-delay:1.2s"/></g>
  <g transform="translate(540 470)"><use class="spark" href="#star" style="animation-delay:2.1s"/></g>
  <g transform="translate(70 492)"><use class="spark" href="#star" style="animation-delay:0.7s"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
